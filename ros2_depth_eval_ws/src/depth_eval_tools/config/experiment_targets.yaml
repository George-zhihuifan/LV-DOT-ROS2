camera:
  frame_id: base_link
  image_width: 640
  image_height: 480
  horizontal_fov_rad: 1.047
  near_clip_m: 0.2
  far_clip_m: 12.0
  position_xyz_m: [0.0, 0.35, 1.2]
  gt_depth_reference: front_surface

targets:
  - name: near_target
    center_xyz_m: [2.5, 0.0, 0.9]
    size_xyz_m: [0.55, 0.55, 1.75]
    expected_range_group: near
  - name: mid_target
    center_xyz_m: [5.0, -1.2, 0.9]
    size_xyz_m: [0.55, 0.55, 1.75]
    expected_range_group: mid
  - name: far_target
    center_xyz_m: [7.5, 0.9, 0.9]
    size_xyz_m: [0.55, 0.55, 1.75]
    expected_range_group: far

range_groups:
  near:
    distance_m: [2.0, 3.0]
  mid:
    distance_m: [4.0, 5.0]
  far:
    distance_m: [6.0, 8.0]
